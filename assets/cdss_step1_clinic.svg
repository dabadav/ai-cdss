<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 300" role="img" font-family="'Montserrat',sans-serif" xmlns="http://www.w3.org/2000/svg"><style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{font-family:'Montserrat',sans-serif}
.ttl{font-weight:600;font-size:14px}
.sub{font-weight:400;font-size:12px}
.num{font-weight:600;font-size:12px;fill:#ffffff}
svg g[onclick]{cursor:pointer}
svg g[onclick]:hover{opacity:.85}</style>
<title>Clinic step: patient assessment regions and clinical scales</title>
<desc>A front-facing line-art standing patient figure with a wide torso,
 arms hanging at the sides, and two legs ending in rounded feet. The 
head ring is highlighted in teal, mapped to the MoCA cognitive 
assessment. Both arms, shown as the green limbs at the sides of the 
body, are mapped to the ARAT and Fugl-Meyer upper extremity motor 
scales. The torso and legs are a neutral grey outline.</desc>

<circle cx="28" cy="24" r="11" fill="#1FAAB7"></circle>
<text class="num" x="28" y="24" text-anchor="middle" dominant-baseline="central">1</text>
<text class="ttl" x="46" y="24" dominant-baseline="central" fill="#145C64">Clinic</text>
<text class="sub" x="93" y="25" dominant-baseline="central" fill="#1B7E88">· patient status measurement</text>


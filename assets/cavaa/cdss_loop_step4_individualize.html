<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDSS loop · step 4 highlighted (individualize)</title>
<style>
body{font-family:'Montserrat',sans-serif;background:#fff;margin:0;
  padding:32px 24px;max-width:960px;margin:0 auto}
.dim-step{opacity:.28}
</style>
</head>
<body>
<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5/400.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5/500.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5/600.css');
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg text{font-family:'Montserrat',sans-serif}
.ttl{font-weight:600;font-size:14px}
.sub{font-weight:400;font-size:12px}
.cdss{font-weight:600;font-size:15px}
.num{font-weight:600;font-size:12px;fill:#ffffff}
svg g[onclick]{cursor:pointer}
svg g[onclick]:hover{opacity:.85}
</style>
<h2 class="sr-only">Closed-loop adaptive activity cycle: the clinic measures patient status and feeds the CDSS, which selects activities, monitors the patient, and adjusts the plan before returning activity feedback to the clinic.</h2>
<svg width="100%" viewBox="0 0 680 250" role="img" font-family="'Montserrat',sans-serif" xmlns="http://www.w3.org/2000/svg">
<title>Branded closed-loop CDSS activity cycle</title>
<desc>The clinic measures patient status and feeds a CDSS container holding three numbered steps: select activities, monitor and update the patient model, and adjust the plan. Activity effectiveness feedback returns to the clinic.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="185" y="40" width="455" height="160" rx="16" fill="#F0FAFB" stroke="#1FAAB7" stroke-width="1"/>
<text class="cdss" x="205" y="63" text-anchor="start" fill="#145C64">CDSS</text>

<g class="dim-step" onclick="sendPrompt('Tell me more about the patient status measurement stage in the CDSS loop')">
<rect x="30" y="84" width="120" height="96" rx="8" fill="#E2F5F7" stroke="#1FAAB7" stroke-width="1"/>
<line x1="90" y1="95" x2="90" y2="113" stroke="#1FAAB7" stroke-width="2.4" stroke-linecap="round"/>
<line x1="81" y1="104" x2="99" y2="104" stroke="#1FAAB7" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="48" cy="104" r="11" fill="#1FAAB7"/>
<text class="num" x="48" y="104" text-anchor="middle" dominant-baseline="central">1</text>
<text class="ttl" x="90" y="138" text-anchor="middle" dominant-baseline="central" fill="#145C64">Clinic</text>
<text class="sub" x="90" y="156" text-anchor="middle" dominant-baseline="central" fill="#1B7E88">Patient status</text>
</g>

<g class="dim-step" onclick="sendPrompt('Tell me more about how the CDSS selects the most effective activities')">
<rect x="205" y="84" width="120" height="96" rx="8" fill="#E7F7EE" stroke="#4BC280" stroke-width="1"/>
<rect x="255" y="93" width="20" height="22" rx="3" fill="none" stroke="#4BC280" stroke-width="1.6"/>
<path d="M258 100 l2 2 l4 -5" fill="none" stroke="#4BC280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M258 108 l2 2 l4 -5" fill="none" stroke="#4BC280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="223" cy="104" r="11" fill="#4BC280"/>
<text class="num" x="223" y="104" text-anchor="middle" dominant-baseline="central">2</text>
<text class="ttl" x="265" y="138" text-anchor="middle" dominant-baseline="central" fill="#2C7A4E">Intervention</text>
<text class="sub" x="265" y="156" text-anchor="middle" dominant-baseline="central" fill="#379A63">Select activities</text>
</g>

<g class="dim-step" onclick="sendPrompt('Tell me more about optimising the patient model')">
<rect x="350" y="84" width="120" height="96" rx="8" fill="#E2F5F7" stroke="#1FAAB7" stroke-width="1"/>
<polyline points="398,104 404,104 407,95 412,113 415,104 422,104" fill="none" stroke="#1FAAB7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="368" cy="104" r="11" fill="#1FAAB7"/>
<text class="num" x="368" y="104" text-anchor="middle" dominant-baseline="central">3</text>
<text class="ttl" x="410" y="138" text-anchor="middle" dominant-baseline="central" fill="#145C64">Optimize</text>
<text class="sub" x="410" y="156" text-anchor="middle" dominant-baseline="central" fill="#1B7E88">Update model</text>
</g>

<g onclick="sendPrompt('Tell me more about individualising the plan based on activity effectiveness feedback')">
<rect x="495" y="84" width="120" height="96" rx="8" fill="#E7F7EE" stroke="#4BC280" stroke-width="1"/>
<line x1="544" y1="100" x2="566" y2="100" stroke="#4BC280" stroke-width="1.6" stroke-linecap="round"/>
<line x1="544" y1="109" x2="566" y2="109" stroke="#4BC280" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="550" cy="100" r="2.6" fill="#ffffff" stroke="#4BC280" stroke-width="1.4"/>
<circle cx="560" cy="109" r="2.6" fill="#ffffff" stroke="#4BC280" stroke-width="1.4"/>
<circle cx="513" cy="104" r="11" fill="#4BC280"/>
<text class="num" x="513" y="104" text-anchor="middle" dominant-baseline="central">4</text>
<text class="ttl" x="555" y="138" text-anchor="middle" dominant-baseline="central" fill="#2C7A4E">Individualize</text>
<text class="sub" x="555" y="156" text-anchor="middle" dominant-baseline="central" fill="#379A63">Refine plan</text>
</g>

<line x1="152" y1="132" x2="203" y2="132" stroke="#145C64" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="327" y1="132" x2="348" y2="132" stroke="#145C64" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="472" y1="132" x2="493" y2="132" stroke="#145C64" stroke-width="1.4" marker-end="url(#arrow)"/>

<path d="M555 180 L555 222 L90 222 L90 180" fill="none" stroke="#4BC280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="sub" x="322" y="214" text-anchor="middle" fill="#2C7A4E">Most effective activity feedback</text>
</svg>
</body>
</html>
